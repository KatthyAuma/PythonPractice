<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINEbank - Security Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 178px;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .logo {
            padding: 0 20px 30px 20px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-weight: 300;
        }

        .nav-item {
            padding: 12px 20px;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background-color: #2a2a2a;
            color: white;
        }

        .nav-item.active {
            background-color: #1a9b8e;
            color: white;
        }

        .nav-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logout-section {
            margin-top: auto;
            padding: 0 20px;
        }

        .logout-btn {
            width: 100%;
            padding: 12px 20px;
            background-color: #2a2a2a;
            color: #999;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: #333;
            color: white;
        }

        .user-profile {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .view-profile {
            color: #999;
            font-size: 12px;
            cursor: pointer;
        }

        .menu-dots {
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
        }

        .header {
            background-color: #e8e8e8;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .date {
            color: #666;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .notification-icon {
            position: relative;
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .notification-dot {
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 8px;
            background-color: #1a9b8e;
            border-radius: 50%;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            padding: 8px 40px 8px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            width: 250px;
            background-color: transparent;
        }

        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 0;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab.active {
            color: #1a9b8e;
            border-bottom-color: #1a9b8e;
        }

        .form-container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-label {
            display: block;
            color: #333;
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fafafa;
        }

        .form-input:focus {
            outline: none;
            border-color: #1a9b8e;
            background-color: white;
        }

        .phone-input-group {
            display: flex;
            gap: 12px;
        }

        .country-code {
            width: 100px;
        }

        .phone-number {
            flex: 1;
        }

        .update-btn {
            padding: 14px 32px;
            background-color: #1a9b8e;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .update-btn:hover {
            background-color: #158a7f;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            FINE<span>bank</span>
        </div>
        
        <div class="nav-item">
            <div class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </div>
            Overview
        </div>

        <div class="nav-item">
            <div class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="7" width="20" height="14" rx="2"></rect>
                    <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
            </div>
            Accounts
        </div>

        <div class="nav-item">
            <div class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
            </div>
            Transactions
        </div>

        <div class="nav-item active">
            <div class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M12 1v6m0 6v6m5.2-13.2l-4.2 4.2m0 6l4.2 4.2m5-10.2h-6m-6 0H1m13.2 5.2l-4.2-4.2m0-6L5.8 5.8"></path>
                </svg>
            </div>
            Settings
        </div>

        <div class="logout-section">
            <button class="logout-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
            <div class="user-profile">
                <div class="user-info">
                    <span class="user-name">Okello Max</span>
                    <span class="view-profile">View profile</span>
                </div>
                <div class="menu-dots">⋮</div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="date">
                <span>≫</span>
                <span>May 19, 2023</span>
            </div>
            <div class="header-right">
                <div class="notification-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <div class="notification-dot"></div>
                </div>
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search here">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="tabs">
                <div class="tab" onclick="showTab('account')">Account</div>
                <div class="tab active" onclick="showTab('security')">Security</div>
            </div>

            <!-- Account Tab Content -->
            <div id="account-content" class="form-container" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-input" value="Charlene Reed">
                </div>

                <div class="form-group">
                    <label class="form-label">User Name</label>
                    <input type="text" class="form-input" value="Charlene Reed">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" value="charlenereed@gmail.com">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" value="**********">
                </div>

                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="text" class="form-input" value="25 January 1990">
                </div>

                <div class="form-group">
                    <label class="form-label">Present Address</label>
                    <input type="text" class="form-input" value="San Jose, California, USA">
                </div>

                <div class="form-group">
                    <label class="form-label">Permanent Address</label>
                    <input type="text" class="form-input" value="San Jose, California, USA">
                </div>

                <div class="form-group">
                    <label class="form-label">City</label>
                    <input type="text" class="form-input" value="San Jose">
                </div>

                <div class="form-group">
                    <label class="form-label">Postal Code</label>
                    <input type="text" class="form-input" value="45962">
                </div>

                <div class="form-group">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-input" value="USA">
                </div>

                <button class="update-btn">Save</button>
            </div>

            <!-- Security Tab Content -->
            <div id="security-content" class="form-container">
                <div class="form-group">
                    <label class="form-label">Old Password</label>
                    <input type="password" class="form-input" value="************">
                </div>

                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" class="form-input" value="************">
                </div>

                <div class="form-group">
                    <label class="form-label">Retype Password</label>
                    <input type="password" class="form-input" value="************">
                </div>

                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <div class="phone-input-group">
                        <input type="text" class="form-input country-code" value="+880">
                        <input type="text" class="form-input phone-number" value="51547 58868">
                    </div>
                </div>

                <button class="update-btn">Update Password</button>
            </div>
        </div>

        <script>
            function showTab(tabName) {
                // Hide all content
                document.getElementById('account-content').style.display = 'none';
                document.getElementById('security-content').style.display = 'none';
                
                // Remove active class from all tabs
                const tabs = document.querySelectorAll('.tab');
                tabs.forEach(tab => tab.classList.remove('active'));
                
                // Show selected content and activate tab
                if (tabName === 'account') {
                    document.getElementById('account-content').style.display = 'block';
                    tabs[0].classList.add('active');
                } else {
                    document.getElementById('security-content').style.display = 'block';
                    tabs[1].classList.add('active');
                }
            }
        </script>
    </div>
</body>
</html>
